<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xatolik — Savdoyim</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Outfit',-apple-system,'Segoe UI',sans-serif,'Apple Color Emoji','Segoe UI Emoji';
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(900px 600px at 15% -5%,rgba(245,146,11,.16),transparent 55%),
      radial-gradient(700px 600px at 95% 105%,rgba(79,140,255,.10),transparent 55%),#070b14;
    color:#f7faff;-webkit-font-smoothing:antialiased}
  .box{max-width:470px;text-align:center;background:#111c30;border:1px solid #233552;
    border-radius:22px;padding:48px 34px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
    animation:up .5s cubic-bezier(.22,1,.36,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .emoji{font-size:56px;margin-bottom:8px}
  .code{font-size:68px;font-weight:800;letter-spacing:-2px;line-height:1;
    background:linear-gradient(90deg,#f5920b,#f43f6e);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:10px 0 12px}
  p{color:#b3c1d8;font-size:15px;line-height:1.6;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:linear-gradient(135deg,#4f8cff,#7c5cff);color:#fff;font-weight:700;
    padding:13px 26px;border-radius:12px;font-size:15px;box-shadow:0 10px 26px -8px rgba(79,140,255,.6);
    transition:transform .18s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(79,140,255,.7)}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">⚙️</div>
    <div class="code">500</div>
    <h1>Xatolik yuz berdi</h1>
    <p>Serverda kutilmagan xatolik. Iltimos, birozdan so'ng qayta urinib ko'ring.</p>
    <a href="/" class="btn">🏠 Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
