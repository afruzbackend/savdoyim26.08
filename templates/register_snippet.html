<!-- Bu qismni register.html dagi yetkazib_beruvchi bo'limiga qo'shing -->
<!-- Rol tanlash qismidan keyin, yetkazib_beruvchi uchun quyidagini qo'shing: -->

<div id="yetkazuvchi-fields" style="display:none;">
  <div class="form-group">
    <label class="form-label">Transport turi</label>
    <select name="mashina_turi" id="mashinaTuri" class="form-control" onchange="mashinaTur()">
      <option value="">— Tanlang —</option>
      <optgroup label="🚐 Yengil yuk">
        <option value="Damas">Damas</option>
        <option value="Labo">Labo</option>
        <option value="Ford Transit">Ford Transit</option>
        <option value="Mercedes-Benz Sprinter">Mercedes-Benz Sprinter</option>
      </optgroup>
      <optgroup label="🚛 O'rta yuk">
        <option value="Isuzu NQR">Isuzu NQR</option>
        <option value="Isuzu NPR">Isuzu NPR</option>
        <option value="Hyundai Mighty">Hyundai Mighty</option>
        <option value="Hyundai HD78">Hyundai HD78</option>
        <option value="JAC N75">JAC N75</option>
      </optgroup>
      <optgroup label="🚚 Og'ir yuk">
        <option value="KamAZ 4308">KamAZ 4308</option>
        <option value="MAN TGL">MAN TGL</option>
        <option value="Mercedes-Benz Atego">Mercedes-Benz Atego</option>
        <option value="Volvo FL">Volvo FL</option>
        <option value="Scania P-Series">Scania P-Series</option>
      </optgroup>
      <optgroup label="❄️ Muzlatkichli">
        <option value="Isuzu NQR Refrigerated">Isuzu NQR Muzlatkichli</option>
        <option value="Hyundai Mighty Refrigerated">Hyundai Mighty Muzlatkichli</option>
        <option value="Ford Transit Refrigerated">Ford Transit Muzlatkichli</option>
        <option value="Mercedes-Benz Sprinter Refrigerated">Sprinter Muzlatkichli</option>
        <option value="Mercedes-Benz Atego Refrigerated">Atego Muzlatkichli</option>
      </optgroup>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Davlat raqami <span style="color:var(--danger);">*</span></label>
    <input type="text" name="mashina_raqami" id="mashinaRaqami" class="form-control"
           placeholder="01 A 123 AA" maxlength="12"
           style="text-transform:uppercase;letter-spacing:1px;">
    <div style="font-size:11px;color:var(--text3);margin-top:4px;">
      Masalan: 01 A 123 AA yoki 10 BC 456
    </div>
  </div>
</div>

<script>
// Rol tanlanganda yetkazuvchi maydonlarini ko'rsat
function rolTanla(val) {
  // Barcha rol fieldlarini yashir
  document.querySelectorAll('[id$="-fields"]').forEach(el => el.style.display = 'none');
  // Tegishli fieldni ko'rsat
  const field = document.getElementById(val.replace('_','-') + '-fields') ||
                document.getElementById(val + '-fields');
  if (field) field.style.display = 'block';
}

// Mashina raqami majburiy tekshiruv
document.getElementById('mashinaRaqami')?.addEventListener('input', function() {
  this.value = this.value.toUpperCase();
});

// Form submit oldidan tekshirish
document.querySelector('form')?.addEventListener('submit', function(e) {
  const rol = document.querySelector('[name="rol"]')?.value;
  if (rol === 'yetkazib_beruvchi') {
    const raqam = document.getElementById('mashinaRaqami')?.value.trim();
    if (!raqam) {
      e.preventDefault();
      alert("Davlat raqamini kiriting!");
      document.getElementById('mashinaRaqami').focus();
    }
  }
});
</script>
